name: SKVASRA Baseline Regression Comparison

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compare:
    name: Compare failures against unchanged production main
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compare full Node tests and show only failures
        shell: bash
        run: |
          set -uo pipefail
          (cd baseline && npm ci --silent && npm test > ../baseline.log 2>&1) || true
          (cd candidate && npm ci --silent && npm test > ../candidate.log 2>&1) || true
          python3 - <<'PY'
          import re
          from pathlib import Path
          def failures(name):
              lines=Path(name).read_text(errors='replace').splitlines()
              return {m.group(1) for line in lines if (m:=re.match(r'^✖ (.*?) \([0-9.]+ms\)$',line))}
          base,head=failures('baseline.log'),failures('candidate.log')
          print(f'Baseline failures: {len(base)}')
          print(f'Candidate failures: {len(head)}')
          added=head-base; recovered=base-head
          print('New failures:',sorted(added))
          print('Recovered failures:',sorted(recovered))
          if not base and not head:
              print('Both runs fully pass.')
          if added:
              raise SystemExit(1)
          print('No new failing tests compared with production main.')
          PY
