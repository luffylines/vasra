name: SK VASRA Tests

on:
  pull_request:
    branches:
      - migration/vercel-supabase
      - fix/compact-project-cover-cards-20261017
      - fix/achievements-and-officer-photo-upload-20261022
  push:
    branches:
      - fix/compact-project-cover-cards-20261017
      - fix/achievements-and-officer-photo-upload-20261022
      - feature/awards-dashboard-modal-clean-routes-20261022
      - fix/awards-modal-viewport-mobile-20261022
      - fix/awards-photo-preview-modal-shift-20261022
      - feature/awards-cover-caption-first-20261022
      - fix/awards-large-cover-gallery-20261022
      - fix/award-caption-accuracy-20261022
      - fix/award-caption-picker-validation-ui-20261022
      - fix/awards-unicode-facebook-captions-20261022

permissions:
  contents: read

jobs:
  tests:
    name: Node 24 regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run integration and regression tests
        run: npm test
